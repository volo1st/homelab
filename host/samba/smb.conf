[global]
   # Basics
   server string = nas
   workgroup = WORKGROUP
   server role = standalone server

   # Disable desktop-style usershares on this headless NAS host.
   usershare max shares = 0

   # Keep Samba bound to the LAN and loopback, avoiding Docker bridge interfaces.
   interfaces = 127.0.0.1 192.168.88.0/24
   bind interfaces only = yes

   # Hide shares the authenticated user cannot access.
   access based share enum = yes

   # Network performance
   server multi channel support = yes
   min receivefile size = 16384
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   use sendfile = yes
   aio read size = 1
   aio write size = 1
   server signing = disabled
   server min protocol = SMB2_02
   smb2 leases = yes

   # macOS support
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacPro7,1@ECOLOR=226,226,224
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # Filesystem behavior
   case sensitive = true
   strict locking = no

   # Authentication and discovery
   map to guest = Bad User
   host msdfs = no
   mdns name = mdns

[NasShare]
   path = /ocean
   browsable = yes
   read only = no
   guest ok = no

   valid users = @smbwriters
   force group = smbshareusers
   create mask = 0664
   force create mode = 0660
   directory mask = 2775
   force directory mode = 2770
   hide unreadable = yes

[Media]
   path = /ocean/Media
   browsable = yes
   read only = yes
   guest ok = no

   valid users = @smbwriters @smbreaders
   write list = @smbwriters
   force group = smbshareusers
   create mask = 0664
   force create mode = 0660
   directory mask = 2775
   force directory mode = 2770
   hide unreadable = yes

[Public]
   path = /ocean/Public
   browsable = yes
   read only = yes
   guest ok = no

   valid users = @smbshareusers
   write list = @smbwriters
   force group = smbshareusers
   create mask = 0664
   force create mode = 0660
   directory mask = 2775
   force directory mode = 2770
   hide unreadable = yes
